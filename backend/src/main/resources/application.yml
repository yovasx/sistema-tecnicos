spring:
  application:
    name: tecnicos-backend

  datasource:
    # Defaults para correr desde tu PC. Docker los sobrescribe con SPRING_DATASOURCE_*.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tecnicos_db}
    username: ${SPRING_DATASOURCE_USERNAME:tecnicos_user}
    password: ${SPRING_DATASOURCE_PASSWORD:password}

  jpa:
    hibernate:
      ddl-auto: validate      # Hibernate NUNCA toca el esquema: lo manda Flyway
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration