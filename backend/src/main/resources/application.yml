spring:
  application:
    name: tecnicos-backend

  datasource:
    # Defaults para correr desde tu PC. Docker los sobrescribe con SPRING_DATASOURCE_*.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tecnicos_db}
    username: ${SPRING_DATASOURCE_USERNAME:tecnicos_user}
    password: ${SPRING_DATASOURCE_PASSWORD:password}

  jpa:
    hibernate:
      ddl-auto: validate      # Hibernate NUNCA toca el esquema: lo manda Flyway
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    # Mensajería interna. Sin publishers/consumers todavía: la app arranca
    # igual aunque RabbitMQ no esté disponible.
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:tecnicos}
    password: ${SPRING_RABBITMQ_PASSWORD:tecnicos}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 40MB

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

app:
  google:
    client-ids: ${GOOGLE_CLIENT_IDS:}
  jwt:
    # Base64 de al menos 32 bytes. Vacío en local: se usa el secreto de desarrollo
    # con un WARN al arrancar. En producción se inyecta JWT_SECRET.
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:https://api.fixly.bo}
    ttl-minutes: ${JWT_TTL_MINUTES:30}
  mail:
    remitente: ${SMTP_FROM:no-responder@fixly.bo}
  uploads:
    # Documentos del expediente. En producción apuntá a un volumen persistente
    # o cambiá AlmacenArchivosDisco por S3 detrás del mismo puerto.
    dir: ${UPLOADS_DIR:./uploads}
