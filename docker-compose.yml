services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tecnicos_db}
      POSTGRES_USER: ${POSTGRES_USER:-tecnicos_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tecnicos-net

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-tecnicos}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-tecnicos}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - tecnicos-net

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - tecnicos-net

  backend:
    build: ./backend
    pull_policy: build
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:9081}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-tecnicos_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-tecnicos_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-password}
      # Mensajería: todavía no hay publishers ni consumers, pero la conexión
      # queda configurada para el sprint de notificaciones.
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-tecnicos}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-tecnicos}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ISSUER: ${JWT_ISSUER:-https://api.fixly.bo}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-30}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_FROM: ${SMTP_FROM:-no-responder@fixly.bo}
      UPLOADS_DIR: /app/uploads
    volumes:
      - documentos_data:/app/uploads
    ports:
      - "127.0.0.1:${BACKEND_PORT:-9080}:8080"
    networks:
      - tecnicos-net

  web:
    build:
      context: ./mobile
      args:
        EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID:-}
        EXPO_PUBLIC_MAPA_TILES_URL: ${EXPO_PUBLIC_MAPA_TILES_URL:-}
        EXPO_PUBLIC_MAPA_ATRIBUCION: ${EXPO_PUBLIC_MAPA_ATRIBUCION:-}
    pull_policy: build
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-9081}:80"
    networks:
      - tecnicos-net

  pruebas:
    profiles: ["pruebas"]
    build:
      context: ./backend
      target: pruebas
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-tecnicos_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-tecnicos_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-password}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tecnicos-net

networks:
  tecnicos-net:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
  documentos_data:
