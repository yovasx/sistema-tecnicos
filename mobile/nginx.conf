server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 40m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /salud {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # El navegador usa el mismo origen: sin URLs localhost incrustadas ni CORS.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api http://backend:8080;
        proxy_pass $api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # No publicar documentos ni archivos de configuración con fallback de SPA.
    location ~ ^/(perfiles|uploads)(/|$) { return 404; }
    location ~ /\. { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }
}
